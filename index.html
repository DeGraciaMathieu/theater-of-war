<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THÉÂTRE · carte réelle (OSM)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="barre">
  <span class="titre">Théâtre</span>
  <span class="lieu">Angers · 47.48 N, 0.56 O — données © OpenStreetMap</span>
  <span class="etat" id="etat">chargement…</span>
</div>

<div class="scene">
  <canvas id="cv"></canvas>
  <div class="charge" id="charge">
    <div class="spin"></div>
    <h2>Interrogation d'OpenStreetMap</h2>
    <p id="chargeTxt">Récupération des routes, rivières et zones bâties autour d'Angers via l'API Overpass…</p>
  </div>
</div>

<div class="hud">
  <div class="bloc">
    <h3>Affichage</h3>
    <div class="cmd">
      <button id="bTerrain" aria-pressed="true">Terrain</button>
      <button id="bDebit" aria-pressed="false">Débit</button>
      <button id="bRecharge">Recharger Angers</button>
      <button id="bProc">Carte procédurale</button>
    </div>
  </div>
  <div class="bloc fiche" id="fiche"><span class="vide">Touchez une province pour voir ce que la géographie réelle lui a donné.</span></div>
  <div class="bloc stats" id="stats"></div>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
